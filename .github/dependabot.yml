# Security updates only. A limit of 0 turns scheduled version bumps off and still lets
# Dependabot open pull requests for advisories; routine bumps arrive by rebasing on upstream.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 0
    ignore:
      # 4.6 changes inferred schema types; packages/client stops compiling.
      - dependency-name: zod
      # 5.0.292 pulls in undici 5, which has advisories of its own.
      - dependency-name: ai
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
